[project]
name = "ukko-fullCollection"
version = "0.2.1"

dependencies = [
    "types-PyYAML>=6.0",
    "certifi",
    "json5>=0.15.0",
    "empy",
    "lark",
    "termcolor>=2.3.0",
    "charset-normalizer",
    "defusedxml",
    "idna",
    "jsonschema",
    "jsonschema-specifications",
    "numpy",
    "opencv-python",
    "parse",
    "protobuf==3.20.3",
    "pypng",
    "pyproj",
    "requests",
    "scipy",
    "urllib3",
    "pyserial",
    "types-pyserial",
    "termcolor",
    "deepdiff",
    "json5",
    "netifaces",
    "pyyaml>=5.1"

]
[tool.setuptools]
packages = [
    "ukkoCommonCollection",

    #########################
    # App Functionality
    #
    "appAssist","appLogging",
    "ukkoAppTemplates",

    ###############
    # Utils
    #
    "dictUtils","listUtils","ukkoUtils","fileUtils",
    "dictionaryWalker",

    ###############
    # Formatting
    #
    "prettyText",
    "escapeFormatting","markdown",
    "ukkoStyling",
    "prettyData",

    #####################
    # Data Handling
    #
    "transferableData","ukkoDataFormats","ukkoValueHandling",

    ###############
    # Specific Functionality
    #
    "imageProcessing",
    "schemaHandling",
    "network",
    "sysInfo",
]

[project.optional-dependencies]
dev = ["pytest", "black"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
