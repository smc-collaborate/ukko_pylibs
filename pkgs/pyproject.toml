[project]
name = "ukko-fullCollection"
version = "0.2.1"

dependencies = [
    "types-PyYAML==6.0",
    "certifi",
    "json5==0.15.0",
    "empy==4.2.1",
    "lark==1.3.1",
    "termcolor==2.3.0",
    "charset-normalizer==3.4.2",
    "defusedxml==0.7.1",
    "idna==3.10",
    "jsonschema==4.24.0",
    "jsonschema-specifications==2025.4.1",
    "numpy==2.2.6",
    "opencv-python==4.13.0.92",
    "parse==1.19.0",
    "protobuf==3.20.3",
    "pypng==0.20220715.0",
    "pyproj==3.7.1",
    "requests==2.32.4",
    "scipy==1.15.3",
    "urllib3==2.5.0",
    "pyserial==3.5",
    "types-pyserial==3.5",
    "termcolor",
    "deepdiff",
    "json5==0.15.0",
    "netifaces==0.11.0",
    "pyyaml>=5.1"

]
[tool.setuptools]
packages = [
    "ukkoCommonCollection",

    #########################
    # App Functionality
    #
    "appAssist","appLogging",
    "ukkoAppTemplates",

    ###############
    # Utils
    #
    "dictUtils","listUtils","ukkoUtils","fileUtils",
    "dictionaryWalker",

    ###############
    # Formatting
    #
    "prettyText",
    "escapeFormatting","markdown",
    "ukkoStyling",
    "prettyData",

    #####################
    # Data Handling
    #
    "transferableData","ukkoDataFormats","ukkoValueHandling",

    ###############
    # Specific Functionality
    #
    "imageProcessing",
    "schemaHandling",
    "network",
    "sysInfo",
]

[project.optional-dependencies]
dev = ["pytest", "black"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
